version: '3.8'

services:
  archiver:
    image: tyt4/akyuu:v0.1.0
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    restart: unless-stopped
    user: "10001:10001"

  cirno:
    image: tyt4/akyuu:v0.1.0
    command: ["cirno", "-config", "/akyuu/config/config.yaml"]
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    restart: unless-stopped
    user: "10001:10001"

  sunny-milk:
    image: tyt4/akyuu:v0.1.0
    command: ["sunny-milk", "-config", "/akyuu/config/config.yaml"]
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    restart: unless-stopped
    user: "10001:10001"

  luna-child:
    image: tyt4/akyuu:v0.1.0
    command: ["luna-child", "-config", "/akyuu/config/config.yaml"]
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    restart: unless-stopped
    user: "10001:10001"

  star-sapphire:
    image: tyt4/akyuu:v0.1.0
    command: ["star-sapphire", "-config", "/akyuu/config/config.yaml"]
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    restart: unless-stopped
    user: "10001:10001"

  api:
    image: tyt4/akyuu:v0.1.0
    entrypoint: ["/usr/local/bin/api"]
    command: ["-listen", ":8080", "-config", "/akyuu/config/config.yaml"]
    environment:
      - DATABASE_DSN=postgres://${POSTGRES_USER:-akyuu}:${POSTGRES_PASSWORD}@172.17.0.1:5433/${POSTGRES_DB:-akyuu}?sslmode=disable
      - LOG_LEVEL=info
    volumes:
      - ./config/config.prod.yaml:/akyuu/config/config.yaml:ro
      - ./config/sites:/akyuu/config/sites:ro
      - ./storage:/akyuu/storage
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

volumes: {}
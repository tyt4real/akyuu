# Global config for docker-compose deployment
# SFW-only: no NSFW boards, no full downloads, thumbnails only
# Workers enabled: crosspost, lineage, search, ambitious

database:
  dsn: "postgres://akyuu:akyuu@postgres:5432/akyuu?sslmode=disable"

storage:
  dir: "/akyuu/storage"

safety:
  # No CSAM hash list configured — safety check runs but matches nothing
  # hash_list_path: "/akyuu/config/csam_hashes.txt"
  # Optional PhotoDNA API
  # api_url: ""
  # api_token: ""

scheduler:
  # Global defaults
  poll_interval: 60s
  rate_limit_per_sec: 1
  max_concurrent_requests: 1

  # Download policy: SFW-only, thumbnails only (no full images)
  text_only: false
  download_full: false      # never download full images (save disk)
  download_thumb: true      # download thumbnails only
  capture_raw: true         # capture raw HTML for archival
  raw_retention_days: 90

  # Circuit breaker & retries
  circuit_breaker_threshold: 5
  max_attempts: 10
  thread_stale_after: 6h
  missing_before_archive: 3

  # Worker pool
  workers_per_site: 1
  download_backfill_batch: 50
  consecutive_fail_blocklist: 3

sites_dir: "/akyuu/config/sites"

log_level: "info"

# Embeddings (semantic search) - ENABLED for text-only
# Works on post bodies (CommentParsed) only - no images needed
# Embeddings (semantic search) - ENABLED (text-only, no images)
# Works on post bodies (CommentParsed) only - no images needed
embeddings:
  enabled: true
  model_dir: "/akyuu/models/all-MiniLM-L6-v2"
  model_name: "all-MiniLM-L6-v2"
  dimensions: 384
  batch_size: 32
  poll_interval: 10s
  min_text_length: 8

# Multimodal (OCR, CLIP, Whisper) - disabled (needs models)
multimodal:
  poll_interval: 10s
  ocr:
    enabled: false
    tesseract_cmd: "tesseract"
    languages: "eng"
  clip:
    enabled: false
    model_dir: "/akyuu/models/mobileclip-s1"
    model_version: "mobileclip-s1@1.0"
    dimensions: 384
  whisper:
    enabled: false
    whisper_cmd: "whisper-cli"
    model_path: "/akyuu/models/whisper"
    model_name: "base.en"

# Crosspost detection, clustering, continuity - ENABLED
lineage:
  poll_interval: 5m
  crosspost:
    enabled: true
    phash_threshold: 8
  clustering:
    enabled: true
    algo: "phash"
    threshold: 8
    batch_size: 500
  continuity:
    enabled: true
    time_gap_hours: 48
    title_threshold: 0.8
    op_sim_threshold: 0.75
  reply_graph:
    enabled: true

# Saved search evaluation, alerts, trends - ENABLED
search:
  poll_interval: 5m
  evaluator:
    enabled: true
  trends:
    enabled: true
  alerts:
    enabled: false

# Stylometric clustering, anomaly detection - ENABLED
ambitious:
  poll_interval: 15m
  stylometric:
    enabled: true
    min_posts: 5
    ngram_min: 3
    ngram_max: 5
    top_features: 200
    sim_threshold: 0.7
  anomaly:
    enabled: true
    volume_z_threshold: 3.0
    burst_threshold: 5.0
    burst_window_min: 10
    lookback_hours: 168